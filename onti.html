<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Onti's Study Dashboard | Carissa eLearning</title>
<style>
:root{--bg:#f4f1fa;--card:#fff;--ink:#2a2340;--mute:#6f6888;--pri:#6d3fc0;--pri2:#ede5fb;--ok:#1f8a4c;--warn:#c77700;--bad:#c0392b;--line:#e3dcf1}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
header{background:linear-gradient(135deg,#6d3fc0,#9a5fd8);color:#fff;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1.3rem}
header small{opacity:.85}
main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(60,30,100,.06)}
button,.btn{font:inherit;border:0;border-radius:9px;padding:8px 14px;background:var(--pri);color:#fff;cursor:pointer}
button.ghost{background:var(--pri2);color:var(--pri)}
button.danger{background:#fbe9e7;color:var(--bad)}
button.small{padding:4px 9px;font-size:.85rem}
input,select,textarea{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
label{display:block;font-size:.85rem;color:var(--mute);margin:8px 0 3px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.login{max-width:360px;margin:60px auto}
.err{color:var(--bad);margin-top:8px;min-height:1.2em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.subj{cursor:pointer;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.subj:hover{border-color:var(--pri)}
.subj h3{margin:0 0 4px;font-size:1rem}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;background:var(--pri2);color:var(--pri)}
.pill.soon{background:#fff1da;color:var(--warn)}.pill.past{background:#e8f6ee;color:var(--ok)}
.muted{color:var(--mute);font-size:.9rem}
table{width:100%;border-collapse:collapse}td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
.topic{margin:8px 0}.topic b{display:block}.topic ul{margin:3px 0 0 20px;padding:0}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.chk input{width:auto}.chk.done span{text-decoration:line-through;color:var(--mute)}.chk span{flex:1}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:var(--pri2);color:var(--pri)}.tabs button.on{background:var(--pri);color:#fff}
.hidden{display:none}
.big{font-size:2rem;font-weight:700;color:var(--pri)}
@media print{header button,.noprint{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script src="onti-banks/index.js?v=3"></script>
<script>
(function(){
  var API = "/api/onti/";
  var D = null, view = "home", subjId = null, tab = "scope", htab = "overview";
  var app = document.getElementById("app");

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
  function api(path, method, body){
    return fetch(API+path,{method:method||"GET",credentials:"include",headers:{"content-type":"application/json"},body:body?JSON.stringify(body):undefined})
      .then(function(r){return r.json().catch(function(){return {};}).then(function(j){if(!r.ok){var e=new Error(j.error||"Request failed");e.status=r.status;throw e;}return j;});});
  }
  function load(){return api("data").then(function(j){D=j;});}
  function today(){var d=new Date();d.setHours(0,0,0,0);return d;}
  function daysTo(s){if(!s)return null;var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((d-today())/864e5);}
  function nice(s){if(!s)return "Date to be added";var p=s.split("-");var d=new Date(+p[0],+p[1]-1,+p[2]);return d.toLocaleDateString("en-ZA",{weekday:"short",day:"numeric",month:"short"});}
  function subjName(s){return s.name+(s.paper?" ("+s.paper+")":"");}
  function owner(){return D&&D.role==="owner";}

  function loginScreen(msg){
    app.innerHTML='<div class="card login"><h2 style="margin-top:0">Onti\'s study dashboard</h2><p class="muted">Sign in to see your exam timetable and what to study.</p>'+
      '<label>Username</label><input id="u" autocomplete="username" value="onti">'+
      '<div id="pinrow"><label>PIN</label><input id="p" type="password" inputmode="numeric" autocomplete="current-password"></div>'+
      '<p class="err" id="e">'+esc(msg||"")+'</p><button id="go">Sign in</button>'+
      '<p class="muted" style="margin-top:14px">Parent? Sign in as a teacher on the Carissa tracker first, then open this page again.</p></div>';
    function go(){api("login","POST",{username:document.getElementById("u").value,pin:document.getElementById("p").value})
      .then(load).then(render).catch(function(e){document.getElementById("e").textContent=e.message;});}
    api("status").then(function(j){if(j&&j.pin_required===false){document.getElementById("pinrow").style.display="none";document.getElementById("p").value="";}}).catch(function(){});
    document.getElementById("go").onclick=go;
    document.getElementById("u").onkeydown=document.getElementById("p").onkeydown=function(e){if(e.key==="Enter")go();};
  }

  function header(){
    return '<header><div><h1>Onti\'s Study Dashboard</h1><small>Grade 7 final assessments 2026'+(owner()?' &middot; parent view':'')+'</small></div><div>'+
      (view!=="home"?'<button class="ghost" id="back">&larr; All subjects</button> ':'')+
      (D.role==="onti"?'<button class="ghost" id="out">Sign out</button>':'')+'</div></header>';
  }
  function bind(){
    var b=document.getElementById("back"); if(b) b.onclick=function(){view="home";render();};
    var o=document.getElementById("out"); if(o) o.onclick=function(){api("logout","POST").then(function(){D=null;loginScreen();});};
  }

  function avg(sid){
    var m=D.marks.filter(function(x){return x.subject_id===sid&&x.mark!=null&&x.total>0;});
    if(!m.length) return null;
    var sum=0;m.forEach(function(x){sum+=x.mark/x.total*100;});return Math.round(sum/m.length);
  }

  function htabs(){
    var t=[["overview","📅 Overview"],["plan","⏰ Study plan"],["practice","🎯 Practice exams"],[owner()?"monitor":"results",owner()?"🔍 Monitor":"📈 My results"]];
    var h='<div class="tabs noprint">';
    t.forEach(function(x){h+='<button data-h="'+x[0]+'" class="'+(htab===x[0]?'on':'')+'">'+x[1]+'</button>';});
    return h+'</div>';
  }
  function logEvent(kind,detail){if(D&&D.role==="onti")api("event","POST",{kind:kind,detail:detail||{}}).catch(function(){});}

  function home(){
    var h=header()+'<main>'+htabs();
    if(htab==="overview") h+=overviewHtml();
    else if(htab==="plan") h+=planHtml();
    else if(htab==="practice") h+=practiceHtml();
    else if(htab==="results") h+=resultsHtml(false);
    else if(htab==="monitor") h+=monitorHtml();
    h+='</main>';
    app.innerHTML=h;bind();
    Array.prototype.forEach.call(app.querySelectorAll("[data-h]"),function(b){b.onclick=function(){htab=b.getAttribute("data-h");if(htab==="plan")logEvent("view_plan");render();};});
    var ap=document.getElementById("allpractice"); if(ap) ap.onclick=function(){htab="practice";render();};
    Array.prototype.forEach.call(app.querySelectorAll(".subj"),function(el){el.onclick=function(){subjId=el.getAttribute("data-id");tab="scope";view="subj";render();};});
    Array.prototype.forEach.call(app.querySelectorAll("[data-blk]"),function(c){c.onchange=function(){localStorage.setItem("onti_blk_"+c.getAttribute("data-blk"),c.checked?"1":"");if(c.checked)logEvent("block_done",{block:c.getAttribute("data-blk")});render();};});
    Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){logEvent("open_practice",{bank:b.getAttribute("data-go")});location.href="onti-practice.html?paper="+b.getAttribute("data-go");};});
    if(owner()&&htab==="overview"){
      document.getElementById("savepin").onclick=function(){api("save","POST",{op:"set_pin",pin:document.getElementById("pin").value}).then(function(){alert("PIN changed.");return load();}).then(render).catch(function(e){alert(e.message);});};
      document.getElementById("addsub").onclick=function(){var n=prompt("Subject name?");if(!n)return;save("create","subject",null,{name:n,sort:D.subjects.length+1});};
    }
  }

  function overviewHtml(){
    var subs=D.subjects.slice().sort(function(a,b){return (a.exam_date||"9")>(b.exam_date||"9")?1:-1;});
    var next=subs.filter(function(s){var d=daysTo(s.exam_date);return d!=null&&d>=0;})[0];
    var h='<div class="card" style="background:linear-gradient(135deg,#ede5fb,#fff7d6)"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="font-size:2.4rem">🎯</div><div style="flex:1;min-width:200px"><b>Practice exams are ready</b><div class="muted">'+(window.ONTI_BANKS_INDEX||[]).length+' fun, auto-marked papers. Pick a subject below or open them all.</div></div><button id="allpractice" style="padding:12px 22px">See all practice exams</button></div></div>';
    if(next){var d=daysTo(next.exam_date);
      h+='<div class="card"><div class="muted">Next exam</div><div class="big">'+esc(subjName(next))+'</div><div>'+esc(nice(next.exam_date))+' &middot; '+(d===0?'<b>today</b>':d===1?'tomorrow':'in '+d+' days')+'</div></div>';
    } else h+='<div class="card"><b>All exams done. Well done, Onti!</b></div>';
    var openActs=D.activities.filter(function(a){return !a.done;});
    h+='<div class="card"><h3 style="margin-top:0">Exam timetable and subjects</h3><div class="grid">';
    subs.forEach(function(s){
      var d=daysTo(s.exam_date),pc=d==null?'':d<0?'past':d<=3?'soon':'';
      var a=avg(s.id),n=openActs.filter(function(x){return x.subject_id===s.id;}).length;
      var topics=(s.scope||[]).length;
      h+='<div class="subj" data-id="'+s.id+'"><h3>'+esc(subjName(s))+'</h3><span class="pill '+pc+'">'+esc(nice(s.exam_date))+(s.total_marks?' &middot; '+s.total_marks+' marks':'')+'</span>'+
        '<div style="margin-top:6px">'+(bankFor(s)?'<span class="pill" style="background:#fff1c2;color:#8a5a00">🎯 Practice exam</span>':'')+'</div><div class="muted" style="margin-top:6px">'+(topics?topics+' scope topics':'Scope not added yet')+(n?' &middot; '+n+' to do':'')+(a!=null?' &middot; avg '+a+'%':'')+'</div></div>';
    });
    h+='</div></div>';
    if(owner()){
      h+='<div class="card noprint"><h3 style="margin-top:0">Parent settings</h3><div class="row"><div><label>Onti\'s username</label><input value="'+esc(D.username)+'" disabled></div>'+
        '<div><label>Onti\'s PIN</label><input id="pin" value="'+esc(D.pin)+'"></div><div style="align-self:end"><button id="savepin">Change PIN</button></div></div>'+
        '<p class="muted">Only you (signed in as a teacher) and Onti can open this page. Nothing here is visible to learners or other teachers.</p>'+
        '<button class="ghost small" id="addsub">+ Add subject</button></div>';
    }
    return h;
  }

  /* ---------- study planner ---------- */
  var BREAKS=["Drink some water 💧 and stretch your arms","Step outside for fresh air 🌿","Healthy snack time 🍎","Five slow, deep breaths 😮‍💨","Tidy your desk and rest your eyes 👀","Quick dance or a walk around the house 🎵","Look out of the window and rest your eyes 🪟"];
  var LONGB=["Long break: snack, water and fresh air 🥪","Long break: go outside or play with the dog 🌳","Long break: chat with family, no screens 💬"];
  function pad(n){return (n<10?"0":"")+n;}
  function hm(m){return pad(Math.floor(m/60))+":"+pad(m%60);}
  function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
  function bankFor(s){var l=window.ONTI_BANKS_INDEX||[];return l.filter(function(b){return b.subject===s.name&&(!b.paper||b.paper===s.paper);})[0]||null;}
  function buildPlan(){
    var subs=D.subjects.filter(function(s){return s.exam_date;}).sort(function(a,b){return a.exam_date>b.exam_date?1:-1;});
    if(!subs.length) return [];
    var last=subs[subs.length-1].exam_date, days=[], d=today(), counter={}, rr=0;
    var nowMin=(new Date()).getHours()*60+(new Date()).getMinutes();
    while(ymd(d)<=last){
      var key=ymd(d), dow=d.getDay(), weekend=(dow===0||dow===6);
      var upcoming=subs.filter(function(s){return s.exam_date>key;});
      var examToday=subs.filter(function(s){return s.exam_date===key;});
      var tomorrow=new Date(d.getTime()+864e5), tkey=ymd(tomorrow);
      var examTomorrow=subs.some(function(s){return s.exam_date===tkey;});
      var wins=weekend?[[540,720],[840,990]]:(examToday.length?[[870,945]]:[[870,1050],[1110,1140]]);
      if(examTomorrow&&!weekend) wins=[[870,1050],[1110,1140]];
      var items=[];
      if(examToday.length) items.push({t:"exam",start:480,end:720,label:"📝 EXAM today: "+examToday.map(subjName).join(" and "),note:"Read every question twice. Use all your time. You've prepared!"});
      var bi=0, studied=0, maxStudy=weekend?7:(examToday.length?2:6);
      wins.forEach(function(w){
        var t=w[0];
        while(t+25<=w[1]&&studied<maxStudy){
          if(upcoming.length){
            var wts=upcoming.map(function(s,i){return i===0?5:i===1?3:i===2?2:1;});
            var tot=wts.reduce(function(a,b){return a+b;},0), pick=(rr*7)%tot, ix=0;
            while(pick>=wts[ix]){pick-=wts[ix];ix++;}
            rr++;
            var sub=upcoming[ix], c=counter[sub.id]=(counter[sub.id]||0)+1, bank=bankFor(sub), sc=sub.scope||[];
            var what, go=null;
            if(bank&&c%3===0){what="Practice exam: "+bank.title;go=bank.key;}
            else if(sc.length){what="Revise: "+sc[(c-1)%sc.length].topic;}
            else what="Revise class notes and past papers";
            items.push({t:"study",start:t,end:t+25,sub:subjName(sub),label:what,go:go,id:key+"_"+t});
          } else break;
          studied++;t+=25;
          var longb=studied%2===0;
          var bl=longb?20:5;
          if(t+bl<=w[1]+5) items.push({t:longb?"long":"break",start:t,end:t+bl,label:longb?LONGB[(studied/2-1)%LONGB.length]:BREAKS[bi++%BREAKS.length]});
          t+=bl;
        }
      });
      if(examTomorrow) items.push({t:"rest",start:1170,end:1230,label:"🌙 Pack your bag, relax and go to bed early (no screens after 20:00)",note:"Sleep helps your brain remember."});
      days.push({key:key,date:new Date(d.getTime()),items:items,exam:examToday});
      d=new Date(d.getTime()+864e5);
    }
    return days;
  }
  function planHtml(){
    var days=buildPlan(), nowMin=(new Date()).getHours()*60+(new Date()).getMinutes(), tk=ymd(today());
    var h='<div class="card"><h3 style="margin-top:0">Your study plan ⏰</h3><p class="muted">Study for 25 minutes, then take a 5 minute break. After two study blocks, take a longer 20 minute break. Short, focused blocks work better than studying for hours without stopping. School finishes at 12:00 during exams, so afternoons are for study and evenings are for rest.</p></div>';
    days.forEach(function(day,idx){
      var isToday=day.key===tk, past=day.key<tk;
      var title=day.date.toLocaleDateString("en-ZA",{weekday:"long",day:"numeric",month:"long"});
      var inner='';
      day.items.forEach(function(it){
        if(isToday&&it.end<=nowMin&&it.t!=="exam") return;
        var cls=it.t==="study"?"pill":"muted", id=it.id;
        var done=id&&localStorage.getItem("onti_blk_"+id);
        if(it.t==="study"){
          inner+='<div class="chk '+(done?'done':'')+'"><input type="checkbox" data-blk="'+id+'" '+(done?'checked':'')+'><span><b>'+hm(it.start)+' to '+hm(it.end)+'</b> &middot; '+esc(it.sub)+'<br><span class="muted">'+esc(it.label)+'</span></span>'+(it.go?'<button class="small" data-go="'+it.go+'">Start 🚀</button>':'')+'</div>';
        } else if(it.t==="exam"){
          inner+='<div class="chk" style="background:#fff1da;border-radius:8px;padding:8px"><span><b>'+esc(it.label)+'</b><br><span class="muted">'+esc(it.note)+'</span></span></div>';
        } else {
          inner+='<div class="chk" style="color:var(--mute)"><span>'+hm(it.start)+' to '+hm(it.end)+' &middot; '+esc(it.label)+(it.note?'<br>'+esc(it.note):'')+'</span></div>';
        }
      });
      if(!inner) inner='<p class="muted">Nothing more planned for today. Rest well. 💜</p>';
      h+='<details class="card" '+(isToday||idx===1?'open':'')+'><summary style="cursor:pointer;font-weight:700">'+esc(title)+(isToday?' (today)':'')+(day.exam.length?' &middot; EXAM':'')+'</summary>'+inner+'</details>';
    });
    return h;
  }

  /* ---------- practice launcher ---------- */
  function bestFor(key){var a=(D.attempts||[]).filter(function(x){return x.bank_key===key;});if(!a.length)return null;return Math.max.apply(null,a.map(function(x){return Math.round((x.final_score!=null?x.final_score:x.score)/x.total*100);}));}
  function practiceHtml(){
    var h='<div class="card"><h3 style="margin-top:0">Practice exams 🎯</h3><p class="muted">Fun practice papers built from your past papers and scope. They are marked automatically, then show you what went wrong and where to learn more.</p></div><div class="grid">';
    (window.ONTI_BANKS_INDEX||[]).forEach(function(b){
      var best=bestFor(b.key),n=(D.attempts||[]).filter(function(x){return x.bank_key===b.key;}).length;
      h+='<div class="card" style="margin:0"><div style="font-size:2rem">'+esc(b.emoji)+'</div><b>'+esc(b.title)+'</b><div class="muted">'+b.count+' questions &middot; about '+b.minutes+' min</div><div class="muted">'+(n?n+' attempt(s) &middot; best '+best+'%':'Not tried yet')+'</div><p><button data-go="'+b.key+'">'+(n?'Try again':'Start')+'</button></p></div>';
    });
    return h+'</div>';
  }
  function resultsHtml(isOwner){
    var at=D.attempts||[];
    var h='<div class="card"><h3 style="margin-top:0">'+(isOwner?'Attempts':'My results 📈')+'</h3>';
    if(!at.length) h+='<p class="muted">No practice exams completed yet.</p>';
    else{
      h+='<table><tr><th>Date</th><th>Paper</th><th>Score</th><th>Time</th>'+(isOwner?'<th>Hints</th><th>Status</th>':'<th>Parent comment</th>')+'<th></th></tr>';
      at.forEach(function(a){
        var sc=a.final_score!=null?Number(a.final_score):Number(a.score), pc=Math.round(sc/a.total*100);
        var hints=(a.answers||[]).filter(function(r){return r.hint;}).length;
        h+='<tr><td>'+esc(new Date(a.finished_at).toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))+'</td><td>'+esc(a.bank_title||a.bank_key)+'</td><td><b>'+sc+'/'+a.total+'</b> ('+pc+'%)'+(a.final_score!=null?' ✔':'')+'</td><td>'+Math.round((a.seconds||0)/60)+' min</td>'+
          (isOwner?'<td>'+hints+'</td><td>'+(a.moderated_at?'Moderated':'<span class="pill soon">To check</span>')+'</td>':'<td class="muted">'+esc(a.mod_comment||'')+'</td>')+
          '<td><a href="onti-practice.html?paper='+esc(a.bank_key)+'&attempt='+esc(a.id)+'">'+(isOwner?'Review and moderate':'Review')+'</a></td></tr>';
      });
      h+='</table>';
    }
    return h+'</div>';
  }
  function evText(e){
    var d=e.detail||{}, k=e.kind;
    var nm=function(key){var b=(window.ONTI_BANKS_INDEX||[]).filter(function(x){return x.key===key;})[0];return b?b.title:key;};
    if(k==="login") return "Signed in";
    if(k==="view_plan") return "Looked at her study plan";
    if(k==="open_practice") return "Opened practice: "+nm(d.bank);
    if(k==="start") return "Started: "+nm(d.bank);
    if(k==="finish") return "Finished: "+nm(d.bank)+" ("+d.score+"/"+d.total+" in "+Math.round((d.seconds||0)/60)+" min)";
    if(k==="block_done") return "Ticked off a study block";
    if(k==="owner_attempt") return "You tried: "+nm(d.bank);
    return k;
  }
  function monitorHtml(){
    var at=D.attempts||[], ev=D.events||[];
    var login=ev.filter(function(e){return e.kind==="login";})[0];
    var secs=at.reduce(function(s,a){return s+(a.seconds||0);},0);
    var todo=at.filter(function(a){return !a.moderated_at;}).length;
    var blocks=ev.filter(function(e){return e.kind==="block_done";}).length;
    var h='<div class="grid" style="margin-bottom:14px"><div class="card" style="margin:0"><div class="muted">Last sign-in</div><b>'+(login?esc(new Date(login.created_at).toLocaleString("en-ZA",{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})):'Never')+'</b></div>'+
      '<div class="card" style="margin:0"><div class="muted">Practice exams done</div><div class="big">'+at.length+'</div></div>'+
      '<div class="card" style="margin:0"><div class="muted">Time practising</div><div class="big">'+Math.round(secs/60)+'<small style="font-size:1rem"> min</small></div></div>'+
      '<div class="card" style="margin:0"><div class="muted">To moderate</div><div class="big">'+todo+'</div></div>'+
      '<div class="card" style="margin:0"><div class="muted">Study blocks ticked</div><div class="big">'+blocks+'</div></div></div>';
    // weak topics
    var tp={};at.forEach(function(a){(a.answers||[]).forEach(function(r){var k=(a.subject_name||'')+' | '+(r.tl||r.topic);tp[k]=tp[k]||{s:0,m:0};tp[k].s+=r.marks;tp[k].m+=r.max;});});
    var keys=Object.keys(tp).sort(function(a,b){return tp[a].s/tp[a].m-tp[b].s/tp[b].m;});
    h+='<div class="card"><h3 style="margin-top:0">Weakest topics so far</h3>';
    if(!keys.length) h+='<p class="muted">Appears after the first practice exam.</p>';
    keys.slice(0,8).forEach(function(k){var p=Math.round(tp[k].s/tp[k].m*100);h+='<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>'+esc(k)+'</span><span>'+tp[k].s+'/'+tp[k].m+' ('+p+'%)</span></div><div style="height:10px;border-radius:99px;background:var(--pri2);overflow:hidden"><i style="display:block;height:100%;width:'+p+'%;background:'+(p>=70?'var(--ok)':p>=50?'var(--warn)':'var(--bad)')+'"></i></div></div>';});
    h+='</div>';
    h+=resultsHtml(true);
    h+='<div class="card"><h3 style="margin-top:0">Activity log</h3>';
    if(!ev.length) h+='<p class="muted">No activity yet.</p>';
    else h+='<table>'+ev.slice(0,40).map(function(e){return '<tr><td class="muted">'+esc(new Date(e.created_at).toLocaleString("en-ZA",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))+'</td><td>'+esc(evText(e))+'</td></tr>';}).join('')+'</table>';
    return h+'</div>';
  }

  function save(op,entity,id,values){
    return api("save","POST",{op:op,entity:entity,id:id,values:values}).then(load).then(render).catch(function(e){alert(e.message);});
  }

  function scopeToText(scope){
    return (scope||[]).map(function(t){return "# "+t.topic+"\n"+(t.items||[]).map(function(i){return "- "+i;}).join("\n");}).join("\n\n");
  }
  function textToScope(txt){
    var out=[],cur=null;
    txt.split(/\r?\n/).forEach(function(l){
      l=l.trim();if(!l)return;
      if(l[0]==="#"){cur={topic:l.replace(/^#+\s*/,""),items:[]};out.push(cur);}
      else{if(!cur){cur={topic:"General",items:[]};out.push(cur);}cur.items.push(l.replace(/^[-*]\s*/,""));}
    });
    return out;
  }

  function subject(){
    var s=D.subjects.filter(function(x){return x.id===subjId;})[0];
    if(!s){view="home";return render();}
    var h=header()+'<main><div class="card"><h2 style="margin:0">'+esc(subjName(s))+'</h2><div class="muted">'+esc(nice(s.exam_date))+(s.total_marks?' &middot; '+s.total_marks+' marks':'')+'</div></div>';
    var bk=bankFor(s);
    if(bk){var n=(D.attempts||[]).filter(function(x){return x.bank_key===bk.key;}).length,best=bestFor(bk.key);
      h+='<div class="card" style="background:linear-gradient(135deg,#ede5fb,#fff7d6)"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="font-size:2.4rem">'+esc(bk.emoji)+'</div><div style="flex:1;min-width:200px"><b>Practice exam ready</b><div class="muted">'+esc(bk.title)+' &middot; '+bk.count+' questions &middot; about '+bk.minutes+' min'+(n?' &middot; best '+best+'%':'')+'</div></div><button data-go="'+bk.key+'" style="font-size:1.05rem;padding:12px 22px">'+(n?'Try again 🔁':'Start practice exam 🚀')+'</button></div></div>';
    } else h+='<div class="card muted">No practice exam for this subject yet.</div>';
    h+='<div class="tabs"><button data-t="scope" class="'+(tab==="scope"?'on':'')+'">Scope</button><button data-t="acts" class="'+(tab==="acts"?'on':'')+'">Activities</button><button data-t="marks" class="'+(tab==="marks"?'on':'')+'">Marks</button>'+(owner()?'<button data-t="edit" class="'+(tab==="edit"?'on':'')+'">Edit subject</button>':'')+'</div><div class="card">';
    if(tab==="scope"){
      if(!(s.scope||[]).length) h+='<p class="muted">The scope for this subject has not been added yet.</p>';
      (s.scope||[]).forEach(function(t){h+='<div class="topic"><b>'+esc(t.topic)+'</b>'+((t.items||[]).length?'<ul>'+t.items.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul>':'')+'</div>';});
    }
    if(tab==="acts"){
      var acts=D.activities.filter(function(a){return a.subject_id===s.id;});
      h+='<p class="muted">Activities are a to-do list for extra work (worksheets, past papers, homework). Practice exams start from the purple card above.</p>';
      if(!acts.length) h+='<p class="muted">No activities yet.</p>';
      acts.forEach(function(a){
        h+='<div class="chk '+(a.done?'done':'')+'"><input type="checkbox" data-a="'+a.id+'" '+(a.done?'checked':'')+'><span>'+esc(a.title)+(a.kind?' <span class="pill">'+esc(a.kind)+'</span>':'')+(a.due_on?' <span class="muted">due '+esc(nice(a.due_on))+'</span>':'')+(a.notes?'<br><span class="muted">'+esc(a.notes)+'</span>':'')+'</span>'+(owner()?'<button class="danger small" data-da="'+a.id+'">Delete</button>':'')+'</div>';
      });
      if(owner()) h+='<h4>Add activity</h4><div class="row"><div><label>What to do</label><input id="at"></div><div><label>Type</label><select id="ak"><option>Revision</option><option>Practice exam</option><option>Past paper</option><option>Worksheet</option><option>Homework</option></select></div><div><label>Due</label><input id="ad" type="date"></div></div><label>Notes</label><input id="an"><p><button id="addact">Add activity</button></p>';
    }
    if(tab==="marks"){
      var ms=D.marks.filter(function(m){return m.subject_id===s.id;}),a=avg(s.id);
      if(a!=null) h+='<p><b>Average: '+a+'%</b></p>';
      if(!ms.length) h+='<p class="muted">No marks captured yet.</p>'; else {
        h+='<table><tr><th>Assessment</th><th>Type</th><th>Date</th><th>Mark</th><th></th></tr>';
        ms.forEach(function(m){h+='<tr><td>'+esc(m.title)+(m.notes?'<br><span class="muted">'+esc(m.notes)+'</span>':'')+'</td><td>'+esc(m.kind)+'</td><td>'+esc(m.taken_on?nice(m.taken_on):'')+'</td><td>'+(m.mark!=null?esc(m.mark)+(m.total?' / '+esc(m.total)+' ('+Math.round(m.mark/m.total*100)+'%)':''):'-')+'</td><td>'+(owner()?'<button class="danger small" data-dm="'+m.id+'">Delete</button>':'')+'</td></tr>';});
        h+='</table>';
      }
      if(owner()) h+='<h4>Add mark</h4><div class="row"><div><label>Title</label><input id="mt" placeholder="e.g. Practice paper 1"></div><div><label>Type</label><select id="mk"><option>Practice exam</option><option>Test</option><option>Class test</option><option>Past paper</option><option>Final exam</option></select></div></div><div class="row"><div><label>Mark</label><input id="mm" type="number" step="any"></div><div><label>Out of</label><input id="mo" type="number" step="any" value="'+(s.total_marks||'')+'"></div><div><label>Date</label><input id="md" type="date"></div></div><label>Notes</label><input id="mn"><p><button id="addmark">Add mark</button></p>';
    }
    if(tab==="edit"&&owner()){
      h+='<div class="row"><div><label>Name</label><input id="en" value="'+esc(s.name)+'"></div><div><label>Paper</label><input id="ep" value="'+esc(s.paper||'')+'"></div></div><div class="row"><div><label>Exam date</label><input id="ed" type="date" value="'+esc(s.exam_date||'')+'"></div><div><label>Total marks</label><input id="et" type="number" value="'+esc(s.total_marks||'')+'"></div></div>'+
        '<label>Scope (use # for a topic heading and - for each point)</label><textarea id="es" rows="14">'+esc(scopeToText(s.scope))+'</textarea><p><button id="savesub">Save subject</button> <button class="danger" id="delsub">Delete subject</button></p>';
    }
    h+='</div></main>';
    app.innerHTML=h;bind();
    Array.prototype.forEach.call(app.querySelectorAll(".tabs button"),function(b){b.onclick=function(){tab=b.getAttribute("data-t");render();};});
    Array.prototype.forEach.call(app.querySelectorAll("[data-go]"),function(b){b.onclick=function(){logEvent("open_practice",{bank:b.getAttribute("data-go")});location.href="onti-practice.html?paper="+b.getAttribute("data-go");};});
    Array.prototype.forEach.call(app.querySelectorAll("input[data-a]"),function(c){c.onchange=function(){save("update","activity",c.getAttribute("data-a"),{done:c.checked});};});
    Array.prototype.forEach.call(app.querySelectorAll("[data-da]"),function(b){b.onclick=function(){if(confirm("Delete this activity?"))save("delete","activity",b.getAttribute("data-da"));};});
    Array.prototype.forEach.call(app.querySelectorAll("[data-dm]"),function(b){b.onclick=function(){if(confirm("Delete this mark?"))save("delete","mark",b.getAttribute("data-dm"));};});
    function v(id){return document.getElementById(id).value;}
    var aa=document.getElementById("addact");if(aa)aa.onclick=function(){if(!v("at").trim())return;save("create","activity",null,{subject_id:s.id,title:v("at").trim(),kind:v("ak"),due_on:v("ad"),notes:v("an")});};
    var am=document.getElementById("addmark");if(am)am.onclick=function(){if(!v("mt").trim())return;save("create","mark",null,{subject_id:s.id,title:v("mt").trim(),kind:v("mk"),mark:v("mm"),total:v("mo"),taken_on:v("md"),notes:v("mn")});};
    var ss=document.getElementById("savesub");if(ss)ss.onclick=function(){save("update","subject",s.id,{name:v("en").trim(),paper:v("ep").trim(),exam_date:v("ed"),total_marks:v("et"),scope:textToScope(v("es"))});};
    var ds=document.getElementById("delsub");if(ds)ds.onclick=function(){if(confirm("Delete this subject with all its marks and activities?")){view="home";save("delete","subject",s.id);}};
  }

  function render(){
    if(!D) return loginScreen();
    if(view==="subj") subject(); else home();
  }

  load().then(render).catch(function(){loginScreen();});
})();
</script>
</body>
</html>
