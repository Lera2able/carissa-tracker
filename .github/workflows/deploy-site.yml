name: Deploy Tracker Site

on:
  push:
    branches:
      - main
    paths:
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.gif'
      - '*.webp'
      - '*.svg'
      - '*.ico'
      - '*.txt'
      - '*.json'
      - '.github/scripts/prepare-pages-dist.mjs'
      - '.github/workflows/deploy-site.yml'

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare static site bundle
        run: node .github/scripts/prepare-pages-dist.mjs

      - name: Resolve Pages project name
        shell: bash
        run: |
          PROJECT_NAME="${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}"
          if [ -z "$PROJECT_NAME" ]; then
            PROJECT_NAME="carissa-tracker"
          fi
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_ENV"

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Deploy site to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ env.PROJECT_NAME }}
        run: wrangler pages deploy site-dist --project-name="$PROJECT_NAME"
